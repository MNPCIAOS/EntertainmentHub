{% extends 'WEBSITE/dashboard_base.html' %}
{% block title %}{{ heading }} — FILMS{% endblock %}
{% block dashboard_content %}<div class="dash-heading"><div><p class="eyebrow">CATEGORIES</p><h1>{{ heading }}</h1><p>Manage genres without touching the database.</p></div></div><form method="post" class="dash-form">{% csrf_token %}<section class="dash-panel form-panel"><h2>Genre name</h2><div class="field"><label>{{ form.name.label }}</label>{{ form.name }}{{ form.name.errors }}</div><div class="form-actions"><a class="dash-secondary" href="{% url 'dashboard_genres' %}">Cancel</a><button class="dash-primary" type="submit">{{ submit_text }}</button></div></section></form>{% endblock %}
